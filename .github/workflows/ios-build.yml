
name: PawStay AI - Automatic iOS IPA Build

on:
  push:
    branches:
      - main
    paths:
      - '**/api_config.dart'
      - '.github/workflows/ios-build.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build PawStay iOS IPA
    runs-on: macos-15

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Check environment
      - name: Check Build Environment
        run: |
          flutter --version
          flutter doctor -v
          xcodebuild -version
          pod --version

      # 4. Extract IP address from api_config.dart
      - name: Extract PawStay Backend IP
        id: api
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import ipaddress
          import os

          files = list(Path("lib").rglob("api_config.dart"))

          if len(files) != 1:
              raise SystemExit(
                  f"Expected exactly one api_config.dart in lib/, found {len(files)}"
              )

          content = files[0].read_text()

          match = re.search(
              r"deviceIp\s*=\s*String\.fromEnvironment\s*\("
              r"[\s\S]*?defaultValue\s*:\s*['\"]([^'\"]+)['\"]",
              content
          )

          if not match:
              raise SystemExit("Could not find deviceIp defaultValue")

          host = match.group(1).strip()

          try:
              ipaddress.ip_address(host)
          except ValueError:
              raise SystemExit(f"Invalid IP address: {host}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"host={host}\n")

          print(f"PawStay backend IP: {host}")
          PY

      # 5. Configure environment
      - name: Configure Environment
        env:
          PAWSTAY_ENV: ${{ secrets.PAWSTAY_ENV }}
        run: |
          if [ -n "$PAWSTAY_ENV" ]; then
            printf '%s' "$PAWSTAY_ENV" > .env
            echo "Environment configured"
          else
            touch .env
            echo "Created empty .env"
          fi

      # 6. Install Flutter dependencies
      - name: Install Flutter Dependencies
        run: |
          flutter pub get

      # 7. Set iOS deployment target
      - name: Configure iOS Deployment Target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path("ios/Podfile")
          project = Path("ios/Runner.xcodeproj/project.pbxproj")

          if not podfile.exists():
              raise SystemExit("Podfile is missing")

          if not project.exists():
              raise SystemExit("Xcode project is missing")

          content = podfile.read_text()

          if re.search(r"^\s*platform\s+:ios,", content, re.M):
              content = re.sub(
                  r"^\s*platform\s+:ios,\s*['\"][^'\"]+['\"]",
                  "platform :ios, '15.5'",
                  content,
                  count=1,
                  flags=re.M
              )
          else:
              content = "platform :ios, '15.5'\n" + content

          podfile.write_text(content)

          content = project.read_text()

          content, count = re.subn(
              r"IPHONEOS_DEPLOYMENT_TARGET = [^;]+;",
              "IPHONEOS_DEPLOYMENT_TARGET = 15.5;",
              content
          )

          if count == 0:
              raise SystemExit("Deployment target not found")

          project.write_text(content)

          print("iOS deployment target configured: 15.5")
          PY

      # 8. Install CocoaPods
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      # 9. Build iOS with IP extracted from api_config.dart
      - name: Build PawStay iOS
        env:
          API_HOST: ${{ steps.api.outputs.host }}
        run: |
          echo "Building PawStay with backend IP: $API_HOST"

          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=PAWSTAY_API_HOST="$API_HOST"

      # 10. Verify iOS application
      - name: Verify iOS Application
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found"
            exit 1
          fi

          echo "PawStay iOS build successful!"
          ls -lah "$APP_PATH"

      # 11. Package IPA
      - name: Create PawStay IPA
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"

          mkdir -p build/ios/ipa/Payload

          cp -R "$APP_PATH" build/ios/ipa/Payload/

          cd build/ios/ipa

          ditto -c -k --sequesterRsrc --keepParent \
            Payload PawStay.ipa

          echo "IPA generated successfully"
          ls -lh PawStay.ipa

      # 12. Upload IPA
      - name: Upload PawStay IPA
        uses: actions/upload-artifact@v4
        with:
          name: PawStay-iOS-IPA
          path: build/ios/ipa/PawStay.ipa
          if-no-files-found: error
          retention-days: 7


      # 13. Build PawStay for iOS Simulator
      - name: Build iOS Simulator App
        env:
          API_HOST: ${{ steps.api.outputs.host }}
        run: |
          echo "Building simulator app with backend IP: $API_HOST"

          flutter build ios \
            --debug \
            --simulator \
            --dart-define=PAWSTAY_API_HOST="$API_HOST"

      # 14. Package Simulator App for Appetize
      - name: Package iOS Simulator App
        run: |
          APP_PATH="build/ios/iphonesimulator/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Simulator Runner.app not found"
            exit 1
          fi

          cd build/ios/iphonesimulator

          ditto -c -k --sequesterRsrc --keepParent \
            Runner.app PawStay-iOS-Simulator.zip

          echo "Simulator package created!"
          ls -lh PawStay-iOS-Simulator.zip

      # 15. Upload Simulator Build
      - name: Upload PawStay Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: PawStay-iOS-Simulator
          path: build/ios/iphonesimulator/PawStay-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7
