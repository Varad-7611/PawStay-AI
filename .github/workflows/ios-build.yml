
name: PawStay AI - Unsigned iOS Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build PawStay iOS Without Signing
    runs-on: macos-15

    steps:

      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Verify build environment
      - name: Check Build Environment
        run: |
          flutter --version
          flutter doctor -v
          xcodebuild -version
          pod --version

      # 4. Configure environment
      - name: Configure Environment
        env:
          PAWSTAY_ENV: ${{ secrets.PAWSTAY_ENV }}
        run: |
          if [ -n "$PAWSTAY_ENV" ]; then
            printf '%s' "$PAWSTAY_ENV" > .env
            echo "Environment configured"
          elif [ -f ".env" ]; then
            echo "Using existing environment file"
          else
            echo "No .env file found"
          fi

      # 5. Install Flutter dependencies
      - name: Install Flutter Dependencies
        run: |
          flutter pub get

      # 6. Set iOS deployment target
      - name: Configure iOS Deployment Target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path("ios/Podfile")
          project = Path("ios/Runner.xcodeproj/project.pbxproj")

          if not podfile.exists():
              raise SystemExit("Podfile is missing")

          if not project.exists():
              raise SystemExit("Xcode project is missing")

          content = podfile.read_text()

          if re.search(r"^\s*platform\s+:ios,", content, re.M):
              content = re.sub(
                  r"^\s*platform\s+:ios,\s*['\"][^'\"]+['\"]",
                  "platform :ios, '15.5'",
                  content,
                  count=1,
                  flags=re.M
              )
          else:
              content = "platform :ios, '15.5'\n" + content

          podfile.write_text(content)

          content = project.read_text()

          content, count = re.subn(
              r"IPHONEOS_DEPLOYMENT_TARGET = [^;]+;",
              "IPHONEOS_DEPLOYMENT_TARGET = 15.5;",
              content
          )

          if count == 0:
              raise SystemExit("Deployment target not found")

          project.write_text(content)

          print("iOS deployment target: 15.5")
          PY

      # 7. Generate Flutter iOS configuration
      - name: Generate iOS Configuration
        run: |
          flutter build ios --config-only --release --no-codesign

      # 8. Install CocoaPods
      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      # 9. Build directly using Xcode
      # Explicitly disable every code-signing requirement
      - name: Build iOS Using Xcode Without Signing
        run: |
          set -o pipefail

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee xcode-build.log

      # 10. Verify generated application
      - name: Verify iOS Application
        run: |
          APP_PATH="build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app"

          if [ -d "$APP_PATH" ]; then
            echo "PawStay iOS build successful!"
            ls -lah "$APP_PATH"
          else
            echo "Runner.app not found"
            exit 1
          fi

      # 11. Upload application
      - name: Upload PawStay iOS App
        uses: actions/upload-artifact@v4
        with:
          name: PawStay-iOS-App
          path: build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7

      # 12. Upload diagnostic logs
      - name: Upload Xcode Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PawStay-iOS-Build-Logs
          path: xcode-build.log
          if-no-files-found: warn
          retention-days: 7
